<noscript>Tall Grass Clicker needs JavaScript to run.</noscript>
<script src="game.js"></script>
<script>
  // Offline support. Not on file:// or in the local dev server (localhost), where a stale cache would only get in the way.
  if ("serviceWorker" in navigator) {
    if (location.protocol.startsWith("http") && location.hostname !== "localhost") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    else navigator.serviceWorker.getRegistrations().then((all) => all.forEach((r) => r.unregister())).catch(() => {});
  }
</script>
</body>
